[project]
name = "service-monitor"
version = "0.1.0"
description = "REST API that monitors whether configured network services are reachable over TCP, HTTP(S) or SSH."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.159.1",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
exclude_also = ["case _:\\s+assert_never\\("]  # reachable only if a CheckType has no case

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "SIM", "D"]
ignore = ["D105", "D107"]  # magic methods and __init__ are documented by their class

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D102", "D103"]  # test names describe the test; fakes are described by their class
